version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: three-kingdoms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: threekingdoms
      POSTGRES_PASSWORD: dev_password_change_in_production
      POSTGRES_DB: threekingdoms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threekingdoms"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: three-kingdoms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Service
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: three-kingdoms-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://threekingdoms:dev_password_change_in_production@postgres:5432/threekingdoms
      REDIS_URL: redis://redis:6379
      PORT: 4000
      HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
      LOG_LEVEL: debug
    ports:
      - "4000:4000"
    volumes:
      # Mount source code for hot reload
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/database/node_modules
      - /app/packages/types/node_modules
    command: >
      sh -c "
        cd /app/packages/database &&
        npx prisma generate &&
        npx prisma migrate deploy &&
        cd /app/apps/api &&
        npm run dev
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Web Frontend
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: three-kingdoms-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: development
      VITE_GRAPHQL_ENDPOINT: http://localhost:4000/graphql
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"
    volumes:
      # Mount source code for hot reload
      - ./apps/web:/app/apps/web
      - ./packages/ui:/app/packages/ui
      - ./packages/types:/app/packages/types
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/ui/node_modules
      - /app/packages/types/node_modules
    command: npm run dev
    stdin_open: true
    tty: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: three-kingdoms-network
